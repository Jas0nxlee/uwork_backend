services:
  backend:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/uwork.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
